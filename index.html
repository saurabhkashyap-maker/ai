<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>My AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">AI Assistant</h1>
        <div class="status-label" id="status">Tap the orb to start</div>

        <div class="orb-wrapper" id="orb-wrapper">
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <div class="orb" id="orb">
                <div class="blob blob-1"></div>
                <div class="blob blob-2"></div>
                <div class="blob blob-3"></div>
                <div class="equalizer">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <!-- FALLBACK TEXT INPUT -->
        <div class="text-input-row">
            <input id="text-input" type="text" placeholder="Or type a command here...">
            <button id="send-btn">Send</button>
        </div>

        <div class="transcript-container">
            <p id="user-text"></p>
            <p id="ai-text"></p>
        </div>
    </div>

    <script src="script.js?v=200"></script>
</body>
</html>
